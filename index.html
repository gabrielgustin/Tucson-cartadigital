<title>Tucson · Carta</title>

<meta name="theme-color" content="#2f2f2f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Oswald:wght@400;500&family=Montserrat:wght@400;500;600&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{
  --char:#383838; --char-2:#2c2c2c; --cu:#b07f5e; --cu-2:#d2a27f; --red:#a3302b;
  --paper:#f7f3ee; --card:#fff; --ink:#2b2b2b; --mute:#6b6560; --line:#e3dad1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.dia{display:inline-block;width:7px;height:7px;background:var(--cu);transform:rotate(45deg);flex:none}

/* ---------- portada ---------- */
.hero{position:relative;background:var(--char);color:#fff;text-align:center;padding:72px 16px 56px;overflow:hidden}
.hero .new{position:absolute;top:22px;right:max(16px,calc(50% - 520px));transform:rotate(-8deg);font-family:'Kaushan Script';font-size:1.5rem;line-height:1}
.hero .new small{display:block;font-family:Montserrat;font-size:.55rem;letter-spacing:.35em;color:var(--cu-2);text-transform:uppercase;margin-top:4px}
.logo{font-family:Oranienbaum,serif;font-weight:400;font-size:clamp(4.6rem,19vw,9.5rem);line-height:1;letter-spacing:.14em;margin-right:-.14em;text-transform:uppercase}
.logo span{display:inline-block}
.sub{margin-top:10px;font-weight:600;font-size:clamp(.95rem,3.6vw,1.45rem);letter-spacing:.42em;margin-right:-.42em;color:var(--cu);text-transform:uppercase}
.dots{display:flex;justify-content:center;gap:16px;margin:28px 0 26px}
.perks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.perk{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 7px;border:1px solid rgba(255,255,255,.28);font-family:Oswald;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase}
.perk svg{width:18px;height:18px;flex:none}
.perk.red{background:var(--red);border-color:var(--red)}
.deco{position:absolute;pointer-events:none;color:rgba(255,255,255,.35)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:var(--char-2);border-bottom:2px solid var(--cu)}
.nav ul{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:10px 16px;max-width:1120px;margin:0 auto;scrollbar-width:none;scroll-snap-type:x proximity}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:7px 13px 6px;border:1px solid rgba(255,255,255,.22);color:#e9e2db;font-family:Oswald;font-size:.86rem;letter-spacing:.13em;text-transform:uppercase;text-decoration:none;scroll-snap-align:center;transition:background .2s,color .2s,border-color .2s}
.nav a[aria-current="true"]{background:var(--cu);border-color:var(--cu);color:#fff}

/* ---------- secciones ---------- */
main{padding:36px 0 10px}
.grid{columns:2 460px;column-gap:44px}
.sec{break-inside:avoid;margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.sec-h::before,.sec-h::after{content:"";flex:1;height:1px;background:#c9c0b7}
.ribbon{position:relative;padding:7px 26px 6px;background:var(--bg,var(--char));color:#fff;font-family:Oswald;font-weight:400;font-size:clamp(1.15rem,4.4vw,1.4rem);letter-spacing:.16em;margin-right:-.16em;text-transform:uppercase;white-space:nowrap;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.sec.r .ribbon{--bg:var(--red)}
.sec-note{text-align:center;font-size:.78rem;color:var(--mute);margin:-8px 0 14px}
.items{list-style:none;background:var(--card);border:1px solid var(--line);padding:4px 18px}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:13px 0}
.it+.it{border-top:1px dashed var(--line)}
.it h3{font-family:Oswald;font-weight:500;font-size:1.02rem;letter-spacing:.12em;line-height:1.25;color:var(--red);text-transform:uppercase}
.it h3 .nw{font-family:'Kaushan Script';font-size:1.05rem;letter-spacing:0;text-transform:none;color:var(--ink);margin-right:7px}
.it h3 .st{color:var(--cu);font-size:.8em}
.it h3 .gf{display:inline-block;width:19px;height:19px;vertical-align:-3px;margin-left:6px;color:var(--ink)}
.it p{grid-column:1/-1;font-size:.84rem;line-height:1.45;color:#4a4540;max-width:58ch}
.prices{display:flex;gap:14px;text-align:right;align-self:start}
.pr{font-family:Oswald;font-weight:500;font-size:1.08rem;letter-spacing:.06em;white-space:nowrap;color:var(--red)}
.pr small{display:block;font-family:Oswald;font-weight:400;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:1px}
.it.wide .prices{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap;text-align:left;gap:8px 20px;margin-top:2px}
.side{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.8rem;color:var(--mute)}
.side svg{width:22px;height:22px;flex:none;color:var(--ink)}
.side b{font-family:Oswald;font-weight:500;letter-spacing:.08em;color:var(--ink)}

/* ---------- pie ---------- */
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;padding-top:12px;padding-bottom:40px}
.legend div{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);font-family:Oswald;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;line-height:1.35}
.legend svg{width:26px;height:26px;flex:none}
.foot{background:var(--char);color:#fff;text-align:center;padding:44px 16px calc(44px + env(safe-area-inset-bottom))}
.foot .logo{font-size:3.4rem}
.foot .sub{font-size:.8rem;margin-top:6px}
.foot a{display:inline-block;margin-top:22px;font-size:.78rem;font-weight:500;letter-spacing:.2em;text-decoration:none;border-bottom:1px solid var(--cu);padding-bottom:4px}

/* ---------- animaciones: solo transform/opacity, una vez por elemento ---------- */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
.hero .logo span{animation:rise .9s calc(var(--i) * 90ms + .1s) cubic-bezier(.2,.7,.2,1) both}
.hero .sub{animation:fade 1s .75s both}
.hero .dots .dia{animation:fade .5s calc(var(--i) * 120ms + 1s) both}
.hero .new{animation:fade 1s 1.2s both}
.deco.arrow{animation:drift 3.5s 1.4s ease-in-out infinite}
.nav a[aria-current="true"]{animation:chip .35s ease-out}
@keyframes rise{0%{opacity:0;transform:translateY(40%)}100%{opacity:1;transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes drift{50%{transform:translateY(8px)}}
@keyframes chip{50%{transform:scale(1.08)}}
@media (max-width:900px){.deco{display:none}}
@media (max-width:640px){
  .hero{padding-top:84px}
  .items{padding:2px 14px}
  .it h3{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>

// ---------- render ----------
const money = n => '$ ' + n.toLocaleString('es-AR');
const price = (v, label) => `<span class="pr">${label ? `<small>${label}</small>` : ''}${money(v)}</span>`;
const prices = p => typeof p === 'object' ? Object.entries(p).map(([k, v]) => price(v, k)).join('') : price(p);

const item = (it, gf) => `<li class="it${typeof it.p === 'object' && Object.keys(it.p).length > 2 ? ' wide' : ''}">
  <h3>${it.nw ? '<span class="nw">New</span>' : ''}${it.st ? '<span class="st">★</span> ' : ''}${it.n}${it.st ? ' <span class="st">★</span>' : ''}${it.gf || gf ? GF : ''}</h3>
  <div class="prices">${prices(it.p)}</div>
  ${it.d ? `<p>${it.d}</p>` : ''}
</li>`;

const section = s => `<section class="sec${s.r ? ' r' : ''}" id="${s.id}" aria-labelledby="${s.id}-t">
  <header class="sec-h"><h2 class="ribbon" id="${s.id}-t">${s.t}</h2></header>
  ${s.note ? `<p class="sec-note">${s.note}</p>` : ''}
  <ul class="items">${s.items.map(it => item(it, s.gf)).join('')}</ul>
  ${s.after ? `<p class="side">${s.after.icon}<span>${s.after.html}</span></p>` : ''}
</section>`;

document.getElementById('menu').innerHTML = SECS.map(section).join('');
document.getElementById('nav').innerHTML = SECS.map(s => `<li><a href="#${s.id}">${s.nav || s.t}</a></li>`).join('');
document.getElementById('gf-legend').outerHTML = GF.replace('class="gf"', '');

// ---------- scroll-spy ----------
const navUl = document.getElementById('nav'), links = [...navUl.querySelectorAll('a')];
let current;
const spy = new IntersectionObserver(es => es.forEach(e => {
  const a = links.find(l => l.hash === '#' + e.target.id);
  if (!e.isIntersecting || a === current) return;
  current?.removeAttribute('aria-current');
  a.setAttribute('aria-current', 'true');
  current = a;
  // solo mueve la barra de chips: scrollIntoView también toca el scroll de la página y lo traba
  navUl.scrollTo({left: a.offsetLeft - (navUl.clientWidth - a.offsetWidth) / 2, behavior: 'smooth'});
}), {rootMargin: '-40% 0px -55% 0px'});
document.querySelectorAll('.sec').forEach(s => spy.observe(s));
// salto sin ensuciar el historial (el botón "atrás" vuelve a salir de la carta)
navUl.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.querySelector(a.hash).scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
});

// ---------- animaciones ----------
const logo = document.querySelector('.hero .logo');
logo.setAttribute('aria-label', logo.textContent);
logo.innerHTML = [...logo.textContent].map((ch, i) => `<span aria-hidden="true" style="--i:${i}">${ch}</span>`).join('');
// cada sección aparece una sola vez al entrar en pantalla
const rv = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); rv.unobserve(e.target); } }), {rootMargin: '0px 0px -8% 0px'});
document.querySelectorAll('.sec, .legend > div').forEach(el => { el.classList.add('rv'); rv.observe(el); });
</script>
